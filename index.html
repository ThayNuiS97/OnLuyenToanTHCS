<selection-tag>      <!-- Thống kê nhanh & Nút Thêm câu hỏi / Quản lý câu hỏi -->
      <div class="flex items-center gap-2 sm:gap-2.5">
        <!-- Chuyển đổi chế độ Học sinh / Giáo viên -->
        <div class="inline-flex rounded-xl bg-slate-100 p-1 border border-slate-200" role="group" aria-label="Chế độ Học sinh hoặc Giáo viên">
          <button
            id="roleStudentBtn"
            type="button"
            onclick="window.setUserRole && window.setUserRole('student')"
            class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer"
          >
            Học sinh
          </button>
          <button
            id="roleTeacherBtn"
            type="button"
            onclick="window.setUserRole && window.setUserRole('teacher')"
            class="px-2.5 py-1.5 rounded-lg text-xs font-bold transition cursor-pointer"
          >
            Giáo viên
          </button>
        </div>

        <div class="hidden md:flex items-center gap-2 bg-indigo-50 border border-indigo-100 px-3 py-1.5 rounded-xl text-xs font-semibold text-indigo-700">
          <span>Điểm tích lũy:</span>
          <span id="headerScore" class="text-sm font-extrabold text-indigo-800">0</span>
        </div>
        <button
          id="openManagerModalBtn"
          type="button"
          class="teacher-only inline-flex items-center gap-1.5 bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 text-xs sm:text-sm font-semibold px-3 py-2 rounded-xl shadow-2xs transition cursor-pointer"
        ></selection-tag>
