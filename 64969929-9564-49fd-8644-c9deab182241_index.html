<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ôn Luyện Toán Thông Minh</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"></script>
  <style>
    :root {
      --bg: #f4f7fb;
      --card: #ffffff;
      --text: #162032;
      --muted: #5a687c;
      --primary: #1d4ed8;
      --primary-hover: #1e40af;
      --primary-soft: #eff6ff;
      --success: #15803d;
      --success-soft: #dcfce7;
      --danger: #b91c1c;
      --danger-soft: #fee2e2;
      --warning: #b45309;
      --warning-soft: #fef3c7;
      --border: #dbe3ef;
      --radius: 14px;
      --shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }

    .container {
      max-width: 1220px;
      margin: 0 auto;
      padding: 20px 16px 48px;
    }

    header {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 22px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 18px;
    }

    .brand h1 {
      margin: 0;
      font-size: 1.45rem;
      color: var(--primary);
    }

    .brand p {
      margin: 4px 0 0;
      font-size: 0.92rem;
      color: var(--muted);
    }

    .header-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .role-switch {
      display: inline-flex;
      background: #eef2f7;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .role-btn {
      border: none;
      background: transparent;
      padding: 7px 13px;
      border-radius: 7px;
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      color: var(--muted);
    }

    .role-btn.active {
      background: var(--primary);
      color: #fff;
    }

    .btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: 0.15s ease;
    }

    .btn:hover:not(:disabled) {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-success {
      background: var(--success);
      border-color: var(--success);
      color: #fff;
    }

    .btn-danger {
      background: var(--danger);
      border-color: var(--danger);
      color: #fff;
    }

    .toolbar {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      box-shadow: var(--shadow);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }

    .mode-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .mode-tab {
      border: 1px solid var(--border);
      background: #f8fafc;
      color: var(--text);
      padding: 8px 14px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .mode-tab.active {
      background: var(--primary-soft);
      border-color: var(--primary);
      color: var(--primary);
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    select, input[type="text"], input[type="number"], textarea {
      font-family: inherit;
      font-size: 0.92rem;
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: #fff;
      color: var(--text);
    }

    textarea {
      width: 100%;
      min-height: 76px;
      resize: vertical;
    }

    .checkbox-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.88rem;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 9px;
      background: var(--warning-soft);
      color: var(--warning);
      border: 1px solid #fcd34d;
      cursor: pointer;
    }

    .grid-layout {
      display: grid;
      grid-template-columns: 1fr 310px;
      gap: 18px;
      align-items: start;
    }

    @media (max-width: 900px) {
      .grid-layout {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
    }

    .q-meta {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      font-size: 0.86rem;
      color: var(--muted);
    }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      background: var(--primary-soft);
      color: var(--primary);
    }

    .q-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin: 0 0 16px;
    }

    .hint-box {
      margin: 12px 0 16px;
      padding: 12px 15px;
      border-radius: 10px;
      background: var(--warning-soft);
      border-left: 4px solid var(--warning);
      color: #451a03;
      font-size: 0.92rem;
    }

    .options-list {
      display: grid;
      gap: 10px;
      margin: 14px 0 18px;
    }

    .option-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      background: #fff;
    }

    .option-item input {
      transform: scale(1.15);
    }

    .option-item.correct-opt {
      background: var(--success-soft);
      border-color: var(--success);
    }

    .option-item.wrong-opt {
      background: var(--danger-soft);
      border-color: var(--danger);
    }

    .flashcard {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 26px 20px;
      min-height: 170px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      background: #f8fafc;
      margin: 14px 0;
    }

    .tf-table {
      width: 100%;
      border-collapse: collapse;
      margin: 14px 0 18px;
    }

    .tf-table th, .tf-table td {
      border: 1px solid var(--border);
      padding: 10px 12px;
      text-align: left;
      font-size: 0.92rem;
    }

    .tf-table th {
      background: #f8fafc;
    }

    .feedback-box {
      margin-top: 16px;
      padding: 14px 16px;
      border-radius: 11px;
      border: 1px solid transparent;
    }

    .feedback-box.correct {
      background: var(--success-soft);
      border-color: #86efac;
      color: #14532d;
    }

    .feedback-box.incorrect {
      background: var(--danger-soft);
      border-color: #fca5a5;
      color: #7f1d1d;
    }

    .q-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .sidebar-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .sidebar-title {
      margin: 0 0 10px;
      font-size: 1rem;
      font-weight: 700;
    }

    .timer-display {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary);
      margin: 8px 0 10px;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
      margin-top: 10px;
    }

    .nav-num {
      border: 1px solid var(--border);
      background: #f8fafc;
      border-radius: 8px;
      padding: 7px 0;
      font-weight: 700;
      font-size: 0.86rem;
      cursor: pointer;
    }

    .nav-num.current {
      outline: 2px solid var(--primary);
    }

    .nav-num.is-correct {
      background: var(--success-soft);
      border-color: var(--success);
      color: var(--success);
    }

    .nav-num.is-wrong {
      background: var(--danger-soft);
      border-color: var(--danger);
      color: var(--danger);
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal {
      background: #fff;
      border-radius: var(--radius);
      max-width: 720px;
      width: 100%;
      max-height: 88vh;
      overflow-y: auto;
      padding: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    .form-row {
      margin-bottom: 12px;
    }

    .form-row label {
      display: block;
      font-weight: 600;
      font-size: 0.88rem;
      margin-bottom: 5px;
    }

    .hidden {
      display: none !important;
    }

    .chip-list {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 10px 0;
    }

    .chip {
      background: var(--primary-soft);
      color: var(--primary);
      padding: 5px 10px;
      border-radius: 999px;
      font-size: 0.86rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="brand">
        <h1>Ôn Luyện Toán Thông Minh</h1>
        <p id="statsLine">Đã làm: 0/0 câu • Đúng: 0 • Chuỗi đúng: 0</p>
      </div>
      <div class="header-controls">
        <div class="role-switch" role="group" aria-label="Chế độ người dùng">
          <button type="button" class="role-btn active" id="roleStudentBtn" onclick="setRole('student')">Học sinh</button>
          <button type="button" class="role-btn" id="roleTeacherBtn" onclick="setRole('teacher')">Giáo viên</button>
        </div>
        <button type="button" class="btn teacher-only hidden" onclick="openAddModal()">+ Thêm câu hỏi</button>
        <button type="button" class="btn teacher-only hidden" onclick="openManageModal()">Quản lý câu hỏi</button>
        <button type="button" class="btn" onclick="resetSession()">Làm lại từ đầu</button>
      </div>
    </header>

    <div class="toolbar">
      <div class="mode-tabs" id="modeTabs">
        <button type="button" class="mode-tab active" data-mode="mcq" onclick="setMode('mcq')">Trắc nghiệm</button>
        <button type="button" class="mode-tab" data-mode="flashcard" onclick="setMode('flashcard')">Dạng thẻ</button>
        <button type="button" class="mode-tab" data-mode="listing" onclick="setMode('listing')">Liệt kê</button>
        <button type="button" class="mode-tab" data-mode="tf" onclick="setMode('tf')">Tích đúng sai</button>
      </div>

      <div class="filter-group">
        <select id="topicSelect" onchange="setTopic(this.value)" aria-label="Chủ đề">
          <option value="ALL">Tất cả chủ đề</option>
        </select>
        <label class="checkbox-pill">
          <input type="checkbox" id="mistakesOnlyCheckbox" onchange="toggleMistakesOnly(this.checked)" />
          Ôn lại câu làm sai / chưa thuộc
        </label>
      </div>
    </div>

    <div class="grid-layout">
      <main class="card" id="questionStage"></main>

      <aside>
        <div class="sidebar-card">
          <h2 class="sidebar-title">Đồng hồ làm bài</h2>
          <div style="display:flex; gap:8px; align-items:center;">
            <select id="timerMinutesSelect" onchange="changeTimerDuration(this.value)" aria-label="Thời gian làm bài">
              <option value="0">Không giới hạn</option>
              <option value="5">5 phút</option>
              <option value="10">10 phút</option>
              <option value="15" selected>15 phút</option>
              <option value="20">20 phút</option>
              <option value="30">30 phút</option>
            </select>
            <button type="button" class="btn" id="timerToggleBtn" onclick="toggleTimer()">Bắt đầu</button>
          </div>
          <div class="timer-display" id="timerDisplay">15:00</div>
          <div id="timerNote" style="font-size:0.84rem; color:var(--muted);">Nhấn Bắt đầu để đếm ngược.</div>
        </div>

        <div class="sidebar-card">
          <h2 class="sidebar-title">Bảng điều hướng câu hỏi</h2>
          <div style="font-size:0.82rem; color:var(--muted);">Sau khi nộp 1 câu, kết quả hiển thị ngay và không thể hoàn tác.</div>
          <div class="nav-grid" id="navGrid"></div>
          <div style="margin-top:14px;">
            <button type="button" class="btn btn-primary" style="width:100%;" onclick="openSummaryModal()">Xem bảng tổng kết</button>
          </div>
        </div>
      </aside>
    </div>
  </div>

  <!-- Modal Thêm / Sửa câu hỏi -->
  <div class="modal-backdrop" id="editorModal">
    <div class="modal">
      <h2 id="editorModalTitle" style="margin-top:0;">Thêm câu hỏi mới</h2>
      <form id="questionForm" onsubmit="saveQuestionFromForm(event)">
        <input type="hidden" id="editQuestionId" />
        <div class="form-row">
          <label for="qModeInput">Dạng câu hỏi</label>
          <select id="qModeInput" onchange="toggleEditorFields()">
            <option value="mcq">Trắc nghiệm (A, B, C, D)</option>
            <option value="flashcard">Dạng thẻ (Mặt trước / Mặt sau)</option>
            <option value="listing">Liệt kê (Nhiều đáp án)</option>
            <option value="tf">Tích đúng sai (4 mệnh đề a, b, c, d)</option>
          </select>
        </div>
        <div class="form-row">
          <label for="qTopicInput">Chủ đề</label>
          <input type="text" id="qTopicInput" required placeholder="Ví dụ: Đại số, Hình học..." style="width:100%;" />
        </div>
        <div class="form-row">
          <label for="qPromptInput">Đề bài / Mặt trước (hỗ trợ LaTeX $...$ và $$...$$)</label>
          <textarea id="qPromptInput" required placeholder="Ví dụ: Tính giá trị của $\sqrt{16} + rac{1}{2}$"></textarea>
        </div>
        <div class="form-row">
          <label for="qHintInput">Gợi ý kiến thức cần áp dụng</label>
          <textarea id="qHintInput" placeholder="Ví dụ: Nhớ định nghĩa căn bậc hai số học $\sqrt{a^2} = |a|$..."></textarea>
        </div>

        <div id="mcqFields">
          <div class="form-row"><label>Đáp án A</label><input type="text" id="opt0" style="width:100%;" /></div>
          <div class="form-row"><label>Đáp án B</label><input type="text" id="opt1" style="width:100%;" /></div>
          <div class="form-row"><label>Đáp án C</label><input type="text" id="opt2" style="width:100%;" /></div>
          <div class="form-row"><label>Đáp án D</label><input type="text" id="opt3" style="width:100%;" /></div>
          <div class="form-row">
            <label for="mcqCorrectInput">Đáp án đúng</label>
            <select id="mcqCorrectInput">
              <option value="0">A</option>
              <option value="1">B</option>
              <option value="2">C</option>
              <option value="3">D</option>
            </select>
          </div>
        </div>

        <div id="flashcardFields" class="hidden">
          <div class="form-row">
            <label for="fcBackInput">Mặt sau / Kiến thức trả lời</label>
            <textarea id="fcBackInput"></textarea>
          </div>
        </div>

        <div id="listingFields" class="hidden">
          <div class="form-row">
            <label for="listingAnswersInput">Các mục đúng (cách nhau bởi dấu chấm phẩy ; hoặc xuống dòng)</label>
            <textarea id="listingAnswersInput" placeholder="Ví dụ: $x = 2$; $x = -2$"></textarea>
          </div>
        </div>

        <div id="tfFields" class="hidden">
          <div class="form-row">
            <label>4 mệnh đề (mỗi dòng: Nội dung mệnh đề | Đúng hoặc Sai)</label>
            <textarea id="tfStatementsInput" placeholder="Mệnh đề a... | Đúng&#10;Mệnh đề b... | Sai&#10;Mệnh đề c... | Đúng&#10;Mệnh đề d... | Sai"></textarea>
          </div>
        </div>

        <div class="form-row">
          <label for="qExplanationInput">Giải thích chi tiết (vì sao đúng, vì sao sai)</label>
          <textarea id="qExplanationInput" required></textarea>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:16px;">
          <button type="button" class="btn" onclick="closeModal('editorModal')">Hủy</button>
          <button type="submit" class="btn btn-primary">Lưu câu hỏi</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal Quản lý câu hỏi & Chia sẻ -->
  <div class="modal-backdrop" id="manageModal">
    <div class="modal">
      <h2 style="margin-top:0;">Quản lý câu hỏi & Chia sẻ</h2>
      <div id="manageList"></div>
      <hr style="margin:18px 0; border:none; border-top:1px solid var(--border);" />
      <div class="form-row">
        <label for="jsonBankArea">Dữ liệu JSON ngân hàng câu hỏi</label>
        <textarea id="jsonBankArea" style="min-height:120px; font-family:monospace; font-size:0.82rem;"></textarea>
      </div>
      <div style="display:flex; flex-wrap:wrap; gap:8px; justify-content:space-between;">
        <div style="display:flex; flex-wrap:wrap; gap:8px;">
          <button type="button" class="btn" onclick="copyJsonBank()">Sao chép JSON</button>
          <button type="button" class="btn btn-primary" onclick="importJsonBank()">Nạp từ JSON</button>
          <button type="button" class="btn" onclick="restoreDefaultBank()">Khôi phục bộ mẫu</button>
        </div>
        <button type="button" class="btn" onclick="closeModal('manageModal')">Đóng</button>
      </div>
    </div>
  </div>

  <!-- Modal Tổng kết bài làm -->
  <div class="modal-backdrop" id="summaryModal">
    <div class="modal">
      <h2 style="margin-top:0;">Bảng tổng kết bài làm</h2>
      <div id="summaryContent"></div>
      <div style="display:flex; justify-content:flex-end; gap:10px; margin-top:18px;">
        <button type="button" class="btn btn-primary" onclick="closeModal('summaryModal')">Đóng</button>
      </div>
    </div>
  </div>

  <script>
    const DEFAULT_QUESTIONS = [
      {
        id: 'mcq_1',
        mode: 'mcq',
        topic: 'Đại số',
        prompt: 'Khai triển biểu thức $(x + 3)^2$ ta được:',
        hint: 'Áp dụng hằng đẳng thức bình phương của một tổng: $(A + B)^2 = A^2 + 2AB + B^2$.',
        options: ['$x^2 + 3x + 9$', '$x^2 + 6x + 9$', '$x^2 + 6x + 6$', '$2x + 6$'],
        correctIndex: 1,
        explanation: 'Theo hằng đẳng thức $(x + 3)^2 = x^2 + 2 \cdot x \cdot 3 + 3^2 = x^2 + 6x + 9$. Đáp án B đúng; các đáp án khác thiếu hệ số $2$ ở hạng tử giữa hoặc tính sai $3^2$.'
      },
      {
        id: 'mcq_2',
        mode: 'mcq',
        topic: 'Hình học',
        prompt: 'Cho tam giác vuông có hai cạnh góc vuông là $6\text{ cm}$ và $8\text{ cm}$. Độ dài cạnh huyền là:',
        hint: 'Áp dụng định lý Py-ta-go: $c^2 = a^2 + b^2$ với $a, b$ là hai cạnh góc vuông.',
        options: ['$10\text{ cm}$', '$14\text{ cm}$', '$\sqrt{14}\text{ cm}$', '$100\text{ cm}$'],
        correctIndex: 0,
        explanation: 'Cạnh huyền bằng $\sqrt{6^2 + 8^2} = \sqrt{36 + 64} = \sqrt{100} = 10\text{ cm}$. Đáp án A đúng; $14\text{ cm}$ là cộng thẳng hai cạnh góc vuông (sai).'
      },
      {
        id: 'mcq_3',
        mode: 'mcq',
        topic: 'Phương trình',
        prompt: 'Nghiệm của phương trình $2x - 6 = 0$ là:',
        hint: 'Chuyển $-6$ sang vế phải đổi dấu thành $+6$, sau đó chia cả hai vế cho $2$.',
        options: ['$x = -3$', '$x = 2$', '$x = 3$', '$x = 6$'],
        correctIndex: 2,
        explanation: '$2x - 6 = 0 \Leftrightarrow 2x = 6 \Leftrightarrow x = 3$. Đáp án C đúng; thay $x = 3$ vào vế trái được $2(3) - 6 = 0$.'
      },
      {
        id: 'fc_1',
        mode: 'flashcard',
        topic: 'Hình học',
        prompt: 'Công thức tính diện tích hình tròn bán kính $R$ là gì?',
        hint: 'Diện tích hình tròn tỉ lệ với bình phương bán kính.',
        back: '$S = \pi R^2$ (với $R$ là bán kính hình tròn). Ví dụ: $R = 2\text{ cm} \Rightarrow S = 4\pi\text{ cm}^2$.',
        explanation: 'Diện tích hình tròn là $S = \pi R^2$, còn chu vi hình tròn là $C = 2\pi R$ (dễ nhầm lẫn hai công thức này).'
      },
      {
        id: 'fc_2',
        mode: 'flashcard',
        topic: 'Đại số',
        prompt: 'Hiệu hai bình phương $a^2 - b^2$ được phân tích thành nhân tử như thế nào?',
        hint: 'Đây là hằng đẳng thức thứ ba trong chương trình đại số.',
        back: '$a^2 - b^2 = (a - b)(a + b)$.',
        explanation: 'Nhân vế phải ta có $(a - b)(a + b) = a^2 + ab - ba - b^2 = a^2 - b^2$.'
      },
      {
        id: 'list_1',
        mode: 'listing',
        topic: 'Số học',
        prompt: 'Liệt kê tất cả các số nguyên tố nhỏ hơn $10$.',
        hint: 'Số nguyên tố là số tự nhiên lớn hơn $1$ chỉ có đúng hai ước là $1$ và chính nó ($1$ không phải số nguyên tố).',
        answers: ['2', '3', '5', '7'],
        explanation: 'Các số nguyên tố nhỏ hơn $10$ gồm $2, 3, 5, 7$. Lưu ý: $1$ không phải số nguyên tố; $4, 6, 8, 9$ là hợp số vì có thêm ước khác.'
      },
      {
        id: 'tf_1',
        mode: 'tf',
        topic: 'Đại số',
        prompt: 'Xét tính đúng/sai của các khẳng định sau với mọi số thực $x$:',
        hint: 'Nhớ rằng bình phương của mọi số thực luôn lớn hơn hoặc bằng $0$: $x^2 \ge 0$.',
        statements: [
          { text: '$x^2 + 1 > 0$ với mọi $x \in \mathbb{R}$.', correct: true },
          { text: '$\sqrt{x^2} = x$ với mọi $x \in \mathbb{R}$.', correct: false },
          { text: '$(x - 1)^2 = (1 - x)^2$ với mọi $x \in \mathbb{R}$.', correct: true },
          { text: 'Nếu $x^2 = 9$ thì bắt buộc $x = 3$.', correct: false }
        ],
        explanation:
          'Khẳng định 1 đúng vì $x^2 \ge 0 \Rightarrow x^2 + 1 \ge 1 > 0$. Khẳng định 2 sai vì $\sqrt{x^2} = |x|$ (khi $x < 0$ thì $|x| = -x$). Khẳng định 3 đúng vì $(1 - x)^2 = [-(x - 1)]^2 = (x - 1)^2$. Khẳng định 4 sai vì $x^2 = 9 \Rightarrow x = 3$ hoặc $x = -3$.'
      }
    ];

    let state = {
      questions: JSON.parse(JSON.stringify(DEFAULT_QUESTIONS)),
      mode: 'mcq',
      topic: 'ALL',
      mistakesOnly: false,
      role: 'student',
      currentIndex: 0,
      submitted: {},
      hintsShown: {},
      flashcardFlipped: {},
      streak: 0,
      timerSeconds: 15 * 60,
      timerRunning: false
    };

    let timerInterval = null;

    function renderMath(element) {
      if (!element || typeof renderMathInElement !== 'function') return;
      renderMathInElement(element, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false },
          { left: '\(', right: '\)', display: false },
          { left: '\[', right: '\]', display: true }
        ],
        throwOnError: false
      });
    }

    function getFilteredQuestions() {
      return state.questions.filter((q) => {
        if (q.mode !== state.mode) return false;
        if (state.topic !== 'ALL' && q.topic !== state.topic) return false;
        if (state.mistakesOnly) {
          const sub = state.submitted[q.id];
          if (!sub) return true;
          return !sub.isCorrect;
        }
        return true;
      });
    }

    function refreshTopicSelect() {
      const select = document.getElementById('topicSelect');
      const topics = Array.from(new Set(state.questions.filter((q) => q.mode === state.mode).map((q) => q.topic)));
      const prev = state.topic;
      select.innerHTML = '<option value="ALL">Tất cả chủ đề</option>';
      topics.forEach((t) => {
        const opt = document.createElement('option');
        opt.value = t;
        opt.textContent = t;
        select.appendChild(opt);
      });
      state.topic = topics.includes(prev) ? prev : 'ALL';
      select.value = state.topic;
    }

    function updateStatsHeader() {
      const total = state.questions.length;
      const doneList = Object.values(state.submitted);
      const doneCount = doneList.length;
      const correctCount = doneList.filter((x) => x.isCorrect).length;
      document.getElementById('statsLine').textContent =
        `Đã nộp: ${doneCount}/${total} câu • Đúng: ${correctCount} • Chuỗi đúng liên tiếp: ${state.streak}`;
    }

    function setRole(role) {
      state.role = role;
      document.getElementById('roleStudentBtn').classList.toggle('active', role === 'student');
      document.getElementById('roleTeacherBtn').classList.toggle('active', role === 'teacher');
      document.querySelectorAll('.teacher-only').forEach((el) => {
        el.classList.toggle('hidden', role !== 'teacher');
      });
      renderAll();
    }

    function setMode(mode) {
      state.mode = mode;
      state.currentIndex = 0;
      document.querySelectorAll('.mode-tab').forEach((tab) => {
        tab.classList.toggle('active', tab.dataset.mode === mode);
      });
      refreshTopicSelect();
      renderAll();
    }

    function setTopic(topic) {
      state.topic = topic;
      state.currentIndex = 0;
      renderAll();
    }

    function toggleMistakesOnly(checked) {
      state.mistakesOnly = checked;
      state.currentIndex = 0;
      renderAll();
    }

    function toggleHint(qId) {
      state.hintsShown[qId] = !state.hintsShown[qId];
      renderQuestionStage();
    }

    function jumpToQuestion(idx) {
      const list = getFilteredQuestions();
      if (idx >= 0 && idx < list.length) {
        state.currentIndex = idx;
        renderAll();
      }
    }

    function nextQuestion() {
      const list = getFilteredQuestions();
      if (state.currentIndex < list.length - 1) {
        state.currentIndex += 1;
        renderAll();
      }
    }

    function prevQuestion() {
      if (state.currentIndex > 0) {
        state.currentIndex -= 1;
        renderAll();
      }
    }

    function submitMcq(q) {
      if (state.submitted[q.id]) return;
      const chosen = document.querySelector('input[name="mcqOpt"]:checked');
      if (!chosen) return;
      const idx = Number(chosen.value);
      const isCorrect = idx === q.correctIndex;
      recordResult(q.id, isCorrect, { chosenIndex: idx });
    }

    function flipFlashcard(qId, masteredChoice) {
      state.flashcardFlipped[qId] = !state.flashcardFlipped[qId];
      if (typeof masteredChoice === 'boolean' && !state.submitted[qId]) {
        recordResult(qId, masteredChoice, { mastered: masteredChoice });
        return;
      }
      renderQuestionStage();
    }

    function normalizeToken(s) {
      return s.replace(/\$/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
    }

    function submitListing(q) {
      if (state.submitted[q.id]) return;
      const raw = document.getElementById('listingInput').value || '';
      const userItems = raw
        .split(/[;
]+/)
        .map((x) => x.trim())
        .filter(Boolean);
      const expectedNorm = q.answers.map(normalizeToken);
      const userNorm = userItems.map(normalizeToken);
      const matched = expectedNorm.filter((ans) => userNorm.includes(ans));
      const noExtra = userNorm.every((u) => expectedNorm.includes(u));
      const isCorrect = matched.length === expectedNorm.length && noExtra && userNorm.length === expectedNorm.length;
      recordResult(q.id, isCorrect, { userItems, matchedCount: matched.length, totalExpected: expectedNorm.length });
    }

    function submitTf(q) {
      if (state.submitted[q.id]) return;
      const answers = [];
      for (let i = 0; i < q.statements.length; i++) {
        const picked = document.querySelector(`input[name="tf_${i}"]:checked`);
        if (!picked) return;
        answers.push(picked.value === 'true');
      }
      const isCorrect = q.statements.every((st, i) => st.correct === answers[i]);
      recordResult(q.id, isCorrect, { answers });
    }

    function recordResult(qId, isCorrect, detail) {
      state.submitted[qId] = { isCorrect, detail };
      if (isCorrect) {
        state.streak += 1;
      } else {
        state.streak = 0;
      }
      renderAll();
    }

    function renderQuestionStage() {
      const stage = document.getElementById('questionStage');
      const list = getFilteredQuestions();

      if (list.length === 0) {
        stage.innerHTML = `
          <p class="q-title">Không có câu hỏi phù hợp với bộ lọc hiện tại.</p>
          <p style="color:var(--muted);">Thử đổi chủ đề, chuyển chế độ học tập hoặc bỏ chọn "Ôn lại câu làm sai / chưa thuộc".</p>
        `;
        return;
      }

      if (state.currentIndex >= list.length) {
        state.currentIndex = 0;
      }

      const q = list[state.currentIndex];
      const sub = state.submitted[q.id];
      const isLocked = Boolean(sub);
      const hintOpen = Boolean(state.hintsShown[q.id]);

      let bodyHtml = '';
      if (q.mode === 'mcq') {
        bodyHtml = `<div class="options-list">`;
        q.options.forEach((opt, idx) => {
          const letter = ['A', 'B', 'C', 'D'][idx] || idx + 1;
          const checked = sub && sub.detail.chosenIndex === idx ? 'checked' : '';
          let cls = 'option-item';
          if (isLocked) {
            if (idx === q.correctIndex) cls += ' correct-opt';
            else if (sub.detail.chosenIndex === idx) cls += ' wrong-opt';
          }
          bodyHtml += `
            <label class="${cls}">
              <input type="radio" name="mcqOpt" value="${idx}" ${checked} ${isLocked ? 'disabled' : ''} />
              <span><strong>${letter}.</strong> ${opt}</span>
            </label>
          `;
        });
        bodyHtml += `</div>`;
      } else if (q.mode === 'flashcard') {
        const flipped = Boolean(state.flashcardFlipped[q.id]);
        bodyHtml = `
          <div class="flashcard">
            <div style="font-size:0.82rem; color:var(--muted); margin-bottom:8px;">${flipped ? 'MẶT SAU' : 'MẶT TRƯỚC'}</div>
            <div style="font-size:1.08rem; font-weight:600;">${flipped ? q.back : q.prompt}</div>
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:8px;">
            <button type="button" class="btn" onclick="flipFlashcard('${q.id}')">${flipped ? 'Xem mặt trước' : 'Lật xem đáp án'}</button>
            <button type="button" class="btn btn-success" ${isLocked ? 'disabled' : ''} onclick="flipFlashcard('${q.id}', true)">Đã thuộc</button>
            <button type="button" class="btn btn-danger" ${isLocked ? 'disabled' : ''} onclick="flipFlashcard('${q.id}', false)">Chưa thuộc</button>
          </div>
        `;
      } else if (q.mode === 'listing') {
        const prevVal = sub && sub.detail.userItems ? sub.detail.userItems.join('; ') : '';
        bodyHtml = `
          <div class="form-row">
            <label for="listingInput">Nhập các đáp án (cách nhau bởi dấu <strong>;</strong> hoặc xuống dòng):</label>
            <textarea id="listingInput" ${isLocked ? 'disabled' : ''} placeholder="Ví dụ: 2; 3; 5; 7">${prevVal}</textarea>
          </div>
        `;
      } else if (q.mode === 'tf') {
        const labels = ['a', 'b', 'c', 'd'];
        bodyHtml = `
          <table class="tf-table">
            <thead>
              <tr>
                <th>Mệnh đề</th>
                <th style="width:90px;">Đúng</th>
                <th style="width:90px;">Sai</th>
              </tr>
            </thead>
            <tbody>
        `;
        q.statements.forEach((st, i) => {
          const picked = sub && sub.detail.answers ? sub.detail.answers[i] : null;
          bodyHtml += `
            <tr>
              <td><strong>${labels[i] || i + 1})</strong> ${st.text}</td>
              <td><input type="radio" name="tf_${i}" value="true" ${picked === true ? 'checked' : ''} ${isLocked ? 'disabled' : ''} /></td>
              <td><input type="radio" name="tf_${i}" value="false" ${picked === false ? 'checked' : ''} ${isLocked ? 'disabled' : ''} /></td>
            </tr>
          `;
        });
        bodyHtml += `</tbody></table>`;
      }

      let feedbackHtml = '';
      if (isLocked) {
        feedbackHtml = `
          <div class="feedback-box ${sub.isCorrect ? 'correct' : 'incorrect'}">
            <div style="font-weight:700; margin-bottom:6px;">
              ${sub.isCorrect ? 'Kết quả: ĐÚNG' : 'Kết quả: CHƯA ĐÚNG'} (Đã khóa hoàn tác — hãy làm tiếp các câu còn lại)
            </div>
            <div>${q.explanation}</div>
          </div>
        `;
      }

      const submitBtnHtml =
        q.mode === 'flashcard'
          ? ''
          : `<button type="button" class="btn btn-primary" ${isLocked ? 'disabled' : ''} onclick="${
              q.mode === 'mcq' ? `submitMcq(getFilteredQuestions()[state.currentIndex])` :
              q.mode === 'listing' ? `submitListing(getFilteredQuestions()[state.currentIndex])` :
              `submitTf(getFilteredQuestions()[state.currentIndex])`
            }">Nộp câu này</button>`;

      stage.innerHTML = `
        <div class="q-meta">
          <span>Câu ${state.currentIndex + 1} / ${list.length} • <span class="badge">${q.topic}</span></span>
          <button type="button" class="btn" onclick="toggleHint('${q.id}')">Gợi ý kiến thức</button>
        </div>
        <h2 class="q-title">${q.prompt}</h2>
        ${hintOpen ? `<div class="hint-box"><strong>Kiến thức cần áp dụng:</strong> ${q.hint || 'Chưa có gợi ý cho câu này.'}</div>` : ''}
        ${bodyHtml}
        ${feedbackHtml}
        <div class="q-actions">
          <button type="button" class="btn" ${state.currentIndex === 0 ? 'disabled' : ''} onclick="prevQuestion()">← Câu trước</button>
          <div style="display:flex; gap:8px;">
            ${submitBtnHtml}
            <button type="button" class="btn" ${state.currentIndex >= list.length - 1 ? 'disabled' : ''} onclick="nextQuestion()">Câu tiếp →</button>
          </div>
        </div>
      `;

      renderMath(stage);
    }

    function renderNavGrid() {
      const grid = document.getElementById('navGrid');
      const list = getFilteredQuestions();
      grid.innerHTML = '';
      list.forEach((q, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'nav-num';
        btn.textContent = String(idx + 1);
        if (idx === state.currentIndex) btn.classList.add('current');
        const sub = state.submitted[q.id];
        if (sub) {
          btn.classList.add(sub.isCorrect ? 'is-correct' : 'is-wrong');
        }
        btn.onclick = () => jumpToQuestion(idx);
        grid.appendChild(btn);
      });
    }

    function formatTime(sec) {
      const m = Math.floor(sec / 60);
      const s = sec % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function renderTimer() {
      const mins = Number(document.getElementById('timerMinutesSelect').value);
      const disp = document.getElementById('timerDisplay');
      const btn = document.getElementById('timerToggleBtn');
      const note = document.getElementById('timerNote');
      if (mins === 0) {
        disp.textContent = '∞';
        btn.disabled = true;
        note.textContent = 'Đang chọn chế độ không giới hạn thời gian.';
      } else {
        btn.disabled = false;
        disp.textContent = formatTime(state.timerSeconds);
        btn.textContent = state.timerRunning ? 'Tạm dừng' : 'Bắt đầu';
        note.textContent = state.timerRunning ? 'Đồng hồ đang chạy...' : 'Nhấn Bắt đầu để đếm ngược.';
      }
    }

    function changeTimerDuration(minsStr) {
      clearInterval(timerInterval);
      state.timerRunning = false;
      const mins = Number(minsStr);
      state.timerSeconds = mins > 0 ? mins * 60 : 0;
      renderTimer();
    }

    function toggleTimer() {
      const mins = Number(document.getElementById('timerMinutesSelect').value);
      if (mins === 0) return;
      if (state.timerRunning) {
        clearInterval(timerInterval);
        state.timerRunning = false;
      } else {
        if (state.timerSeconds <= 0) state.timerSeconds = mins * 60;
        state.timerRunning = true;
        timerInterval = setInterval(() => {
          if (state.timerSeconds > 0) {
            state.timerSeconds -= 1;
            renderTimer();
          } else {
            clearInterval(timerInterval);
            state.timerRunning = false;
            renderTimer();
            openSummaryModal();
          }
        }, 1000);
      }
      renderTimer();
    }

    function resetSession() {
      clearInterval(timerInterval);
      state.submitted = {};
      state.hintsShown = {};
      state.flashcardFlipped = {};
      state.streak = 0;
      state.currentIndex = 0;
      state.timerRunning = false;
      const mins = Number(document.getElementById('timerMinutesSelect').value);
      state.timerSeconds = mins > 0 ? mins * 60 : 0;
      renderAll();
    }

    function openSummaryModal() {
      const total = state.questions.length;
      const doneEntries = Object.entries(state.submitted);
      const correctCount = doneEntries.filter(([, v]) => v.isCorrect).length;
      const wrongQuestions = state.questions.filter((q) => state.submitted[q.id] && !state.submitted[q.id].isCorrect);

      let wrongHtml = '<p style="color:var(--muted);">Chưa có câu làm sai nào được ghi nhận.</p>';
      if (wrongQuestions.length > 0) {
        wrongHtml = '<div class="chip-list">' + wrongQuestions.map((q) => `<span class="chip">${q.topic}: ${q.prompt}</span>`).join('') + '</div>';
      }

      const content = document.getElementById('summaryContent');
      content.innerHTML = `
        <p><strong>Số câu đã nộp:</strong> ${doneEntries.length} / ${total}</p>
        <p><strong>Số câu trả lời đúng:</strong> ${correctCount}</p>
        <p><strong>Chuỗi trả lời đúng liên tiếp hiện tại:</strong> ${state.streak}</p>
        <p><strong>Các câu cần ôn lại:</strong></p>
        ${wrongHtml}
      `;
      renderMath(content);
      document.getElementById('summaryModal').classList.add('open');
    }

    function closeModal(id) {
      document.getElementById(id).classList.remove('open');
    }

    function toggleEditorFields() {
      const mode = document.getElementById('qModeInput').value;
      document.getElementById('mcqFields').classList.toggle('hidden', mode !== 'mcq');
      document.getElementById('flashcardFields').classList.toggle('hidden', mode !== 'flashcard');
      document.getElementById('listingFields').classList.toggle('hidden', mode !== 'listing');
      document.getElementById('tfFields').classList.toggle('hidden', mode !== 'tf');
    }

    function openAddModal() {
      if (state.role !== 'teacher') return;
      document.getElementById('editorModalTitle').textContent = 'Thêm câu hỏi mới';
      document.getElementById('editQuestionId').value = '';
      document.getElementById('questionForm').reset();
      toggleEditorFields();
      document.getElementById('editorModal').classList.add('open');
    }

    function openEditModal(qId) {
      if (state.role !== 'teacher') return;
      const q = state.questions.find((item) => item.id === qId);
      if (!q) return;
      document.getElementById('editorModalTitle').textContent = 'Sửa câu hỏi';
      document.getElementById('editQuestionId').value = q.id;
      document.getElementById('qModeInput').value = q.mode;
      document.getElementById('qTopicInput').value = q.topic;
      document.getElementById('qPromptInput').value = q.prompt;
      document.getElementById('qHintInput').value = q.hint || '';
      document.getElementById('qExplanationInput').value = q.explanation || '';

      if (q.mode === 'mcq') {
        [0, 1, 2, 3].forEach((i) => {
          document.getElementById(`opt${i}`).value = (q.options && q.options[i]) || '';
        });
        document.getElementById('mcqCorrectInput').value = String(q.correctIndex ?? 0);
      } else if (q.mode === 'flashcard') {
        document.getElementById('fcBackInput').value = q.back || '';
      } else if (q.mode === 'listing') {
        document.getElementById('listingAnswersInput').value = (q.answers || []).join('; ');
      } else if (q.mode === 'tf') {
        document.getElementById('tfStatementsInput').value = (q.statements || [])
          .map((st) => `${st.text} | ${st.correct ? 'Đúng' : 'Sai'}`)
          .join('
');
      }

      toggleEditorFields();
      document.getElementById('editorModal').classList.add('open');
    }

    function saveQuestionFromForm(event) {
      event.preventDefault();
      if (state.role !== 'teacher') return;
      const existingId = document.getElementById('editQuestionId').value;
      const mode = document.getElementById('qModeInput').value;
      const topic = document.getElementById('qTopicInput').value.trim() || 'Tổng hợp';
      const prompt = document.getElementById('qPromptInput').value.trim();
      const hint = document.getElementById('qHintInput').value.trim();
      const explanation = document.getElementById('qExplanationInput').value.trim();

      const item = {
        id: existingId || `${mode}_${Date.now()}`,
        mode,
        topic,
        prompt,
        hint,
        explanation
      };

      if (mode === 'mcq') {
        item.options = [0, 1, 2, 3].map((i) => document.getElementById(`opt${i}`).value.trim() || `Lựa chọn ${i + 1}`);
        item.correctIndex = Number(document.getElementById('mcqCorrectInput').value);
      } else if (mode === 'flashcard') {
        item.back = document.getElementById('fcBackInput').value.trim();
      } else if (mode === 'listing') {
        item.answers = document
          .getElementById('listingAnswersInput')
          .value.split(/[;
]+/)
          .map((s) => s.trim())
          .filter(Boolean);
      } else if (mode === 'tf') {
        const lines = document
          .getElementById('tfStatementsInput')
          .value.split('
')
          .map((l) => l.trim())
          .filter(Boolean);
        item.statements = lines.map((line) => {
          const parts = line.split('|');
          const text = (parts[0] || '').trim();
          const flagStr = (parts[1] || '').trim().toLowerCase();
          const correct = flagStr === 'đúng' || flagStr === 'true' || flagStr === '1';
          return { text, correct };
        });
      }

      if (existingId) {
        const idx = state.questions.findIndex((q) => q.id === existingId);
        if (idx !== -1) state.questions[idx] = item;
      } else {
        state.questions.push(item);
      }

      state.mode = mode;
      document.querySelectorAll('.mode-tab').forEach((tab) => {
        tab.classList.toggle('active', tab.dataset.mode === mode);
      });
      closeModal('editorModal');
      refreshTopicSelect();
      renderAll();
    }

    function deleteQuestion(qId) {
      if (state.role !== 'teacher') return;
      state.questions = state.questions.filter((q) => q.id !== qId);
      delete state.submitted[qId];
      refreshTopicSelect();
      openManageModal();
      renderAll();
    }

    function openManageModal() {
      if (state.role !== 'teacher') return;
      const listEl = document.getElementById('manageList');
      listEl.innerHTML = state.questions
        .map(
          (q) => `
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);">
            <div style="font-size:0.9rem;"><strong>[${q.mode.toUpperCase()} • ${q.topic}]</strong> ${q.prompt}</div>
            <div style="display:flex; gap:6px; flex-shrink:0;">
              <button type="button" class="btn" onclick="closeModal('manageModal'); openEditModal('${q.id}')">Sửa</button>
              <button type="button" class="btn btn-danger" onclick="deleteQuestion('${q.id}')">Xóa</button>
            </div>
          </div>
        `
        )
        .join('');
      document.getElementById('jsonBankArea').value = JSON.stringify(state.questions, null, 2);
      renderMath(listEl);
      document.getElementById('manageModal').classList.add('open');
    }

    function copyJsonBank() {
      const area = document.getElementById('jsonBankArea');
      area.select();
      navigator.clipboard?.writeText(area.value).catch(() => {});
    }

    function importJsonBank() {
      if (state.role !== 'teacher') return;
      try {
        const parsed = JSON.parse(document.getElementById('jsonBankArea').value);
        if (Array.isArray(parsed) && parsed.length > 0) {
          state.questions = parsed;
          resetSession();
          refreshTopicSelect();
          closeModal('manageModal');
          renderAll();
        }
      } catch (e) {
        alert('Chuỗi JSON chưa đúng định dạng.');
      }
    }

    function restoreDefaultBank() {
      if (state.role !== 'teacher') return;
      state.questions = JSON.parse(JSON.stringify(DEFAULT_QUESTIONS));
      resetSession();
      refreshTopicSelect();
      openManageModal();
      renderAll();
    }

    function renderAll() {
      updateStatsHeader();
      renderQuestionStage();
      renderNavGrid();
      renderTimer();
    }

    window.addEventListener('DOMContentLoaded', () => {
      refreshTopicSelect();
      renderAll();
    });
  </script>
</body>
</html>
