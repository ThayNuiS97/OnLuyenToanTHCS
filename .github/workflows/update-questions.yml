name: Auto Merge Math Questions

on:
  push:
    branches:
      - main
    paths:
      - "data/**/*.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  merge-questions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate and merge JSON into index.html
        run: node scripts/build-questions.mjs

      - name: Commit updated index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain)" ]]; then
            git add index.html
            git commit -m "chore: cập nhật ngân hàng câu hỏi tự động"
            git push
          fi
